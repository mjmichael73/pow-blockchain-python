
services:
  blockchain-node:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - .:/app
    command: uvicorn blockchain.main:app --host 0.0.0.0 --port 5001 --reload
    ports:
      - "5001:5001"

  blockchain-client:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - .:/app
    command: uvicorn blockchain_client.main:app --host 0.0.0.0 --port 8081 --reload
    ports:
      - "8081:8081"

  # Optional: A second node to demonstrate the P2P network
  blockchain-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - .:/app
    command: uvicorn blockchain.main:app --host 0.0.0.0 --port 5002 --reload
    ports:
      - "5002:5002"
